name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  # Codzienny rebuild o 02:00 UTC: wczorajsze wydarzenia przechodzą do "Zakończone"
  schedule:
    - cron: '0 2 * * *'
  # Przycisk "Run workflow" w zakładce Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie przerywaj trwającego deployu, kolejny poczeka
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
